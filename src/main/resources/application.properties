spring.application.name=upi-splitter
server.port=${SERVER_PORT:8080}
spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/upi_splitter}
spring.data.mongodb.auto-index-creation=true
app.jwt.secret=${JWT_SECRET:change-this-to-a-long-random-secret-at-least-32-characters}
app.jwt.expiration=${JWT_EXPIRATION:86400000}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
app.cors-origins=${FRONTEND_URL:http://localhost:5173}
aws.region=${AWS_REGION:ap-south-1}
aws.s3.bucket=${AWS_S3_BUCKET:}
aws.access-key-id=${AWS_ACCESS_KEY_ID:}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY:}
server.error.include-message=never
server.error.include-stacktrace=never
